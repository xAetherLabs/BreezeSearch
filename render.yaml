services:
  - type: web
    name: breezesearch
    env: go
    plan: standard   # Need Standard plan because we download ~100MB during build
    buildCommand: |
      # Download portable Chromium
      mkdir -p .chromium
      curl -Lo chromium.zip https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/1168552/chrome-linux.zip
      unzip chromium.zip -d .chromium
      rm chromium.zip
      mv .chromium/chrome-linux .chromium-linux

      # Build Go binary
      go mod download
      go build -tags netgo -ldflags "-s -w" -o app
    startCommand: |
      export CHROME_PATH="$(pwd)/.chromium-linux/chrome"
      ./app
    envVars:
      - key: CHROME_PATH
        value: /opt/render/project/src/.chromium-linux/chrome
